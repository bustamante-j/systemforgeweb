<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Ready-to-use website templates — esports, interactive, business, and portfolio, every one running live on the page."
    />
    <meta name="theme-color" content="#f5f3ef" />
    <meta name="color-scheme" content="light" />

    <!-- Fonts are self-hosted, so the two Google origins are off the critical
         path entirely. Archivo sets the catalog title and every
         product name — the first text on the screen — and Space Grotesk the copy
         around them, so those two are preloaded; the mono readouts are small enough to come via the
         stylesheet. Archivo is the width-variable cut: one file covers both the
         expanded display type and the condensed markers. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-wdth-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-latin.woff2"
      crossorigin
    />

    <title>System Forge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
