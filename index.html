<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Ready-to-use portfolio website templates from System Forge — every one running live on the page before you order."
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="color-scheme" content="dark" />

    <!-- Fonts are self-hosted, so the two Google origins are off the critical
         path entirely. Archivo carries the hero lockup — the largest thing on
         the first screen — and Space Grotesk the copy under it, so those two are
         preloaded; the mono readouts are small enough to come via the
         stylesheet. Archivo is the width-variable cut: one file covers both the
         expanded display type and the condensed markers. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-wdth-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-latin.woff2"
      crossorigin
    />

    <!-- Every card preview is an iframe on this origin: warm the connection now
         rather than when the first one scrolls into view. -->
    <link rel="preconnect" href="https://systemforge1.github.io" />
    <link rel="dns-prefetch" href="https://systemforge1.github.io" />

    <title>System Forge — Portfolio templates, running live</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
